[versions]
# 8.9.1 is not a preference, it is the floor GeckoView's own POM sets: it pulls
# androidx.core 1.18.0 and androidx.media3 1.10.1, whose AAR metadata refuses
# any consumer below AGP 8.9.1 and compileSdk 36. AGP 8.9 requires Gradle
# 8.11.1, which is exactly what the wrapper pins, so the chain stops here.
# Raising compileSdk instead of downgrading those two is deliberate: GeckoView
# calls into androidx.core at runtime, so pinning it back is a NoSuchMethodError
# waiting for a user to find.
agp = "8.9.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coroutines = "1.9.0"
serializationJson = "1.7.3"
coreKtx = "1.15.0"
appcompat = "1.7.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
composeBom = "2024.12.01"
room = "2.6.1"
datastore = "1.1.1"
biometric = "1.1.0"
work = "2.10.0"
webkit = "1.12.1"
# GeckoView. NOTE the artifact id has NO channel suffix: it is "geckoview", not
# "geckoview-release" — the latter does not exist. The variant that carries the
# extra bundled codecs is "geckoview-omni".
#
# The version is pinned by minCompileSdk, which the AAR declares in
# META-INF/com/android/build/gradle/aar-metadata.properties. Measured against
# this project's compileSdk = 36:
#
#   153.0.20260810162159  ->  minCompileSdk=1     <- newest usable, pinned here
#   154.0.20260824154132  ->  minCompileSdk=37    <- and every later release
#
# Going past 153 therefore means raising compileSdk to 37, which drags AGP and
# Gradle along with it. Do that deliberately, as its own change, not as a
# side-effect of bumping the engine. Nothing here has to be guessed at again:
# read the aar-metadata.properties out of the AAR before changing this line.
#
# The engine's own POM, read for the same reason, is why compileSdk is 36:
# it declares kotlin-stdlib 2.3.21, androidx.core 1.18.0, media3 1.10.1,
# androidx.annotation 1.10.0 and lifecycle 2.10.0, and the two AARs among
# those demand compileSdk 36 and AGP 8.9.1. The stdlib is handled separately —
# see the pin in build.gradle.kts, and do not remove it without re-reading the
# reasoning there.
geckoview = "153.0.20260810162159"
camera = "1.4.1"
# Guava, pinned to the same variant the engine already puts on the runtime
# classpath (androidx.media3:media3-common depends on 33.3.1-android). See the
# long note on the `guava` dependency in app/build.gradle.kts: this is a
# COMPILE-time repair for a class that only exists at runtime, and the `-android`
# variant is not interchangeable with `-jre` here.
guava = "33.3.1-android"
okhttp = "4.12.0"
zxing = "3.5.3"
web3j = "4.12.3"
bouncycastle = "1.80"
junit = "4.13.2"
mockk = "1.13.13"
truth = "1.4.4"
androidxTestCore = "1.6.1"
androidxJunit = "1.2.1"
espresso = "3.6.1"
uiautomator = "2.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
