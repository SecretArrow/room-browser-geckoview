name: Diagnose (throwaway)

# READ-ONLY DIAGNOSTIC. Resolves dependency graphs and prints them. It builds
# nothing, tests nothing and publishes nothing, so it cannot be confused with
# the pipeline: there is no assemble, no lint, no emulator, no artifact.
#
# It exists because :app:compileDebugKotlin started failing with
#
#   Cannot access class 'com.google.common.util.concurrent.ListenableFuture'.
#   Check your module classpath for missing or conflicting dependencies.
#
# in QrScannerActivity, whose only new fact is that it now calls
# ListenableFuture.addListener on CameraX's ProcessCameraProvider future. The
# compile classpath is the thing to look at, and it cannot be read from the
# source tree: it only exists once Gradle has resolved it. Reasoned guesses
# about capability conflicts are exactly what this replaces.
#
# DELETE THIS FILE once the cause is fixed and recorded in the commit message.
on:
  push:
    branches: [geckoview-engine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  classpath:
    name: Print the resolved classpaths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure the android-36 platform is installed
        run: |
          PLATFORM="$ANDROID_HOME/platforms/android-36"
          if [ ! -f "$PLATFORM/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null || true
          fi
          test -f "$PLATFORM/android.jar" || { echo "::error::platforms;android-36 could not be installed"; exit 1; }

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Why guava / listenablefuture resolve to what they resolve to
        run: |
          cd android
          for cfg in debugCompileClasspath debugRuntimeClasspath; do
            echo "############ $cfg ############"
            for dep in listenablefuture guava concurrent-futures; do
              echo "-------- :app dependencyInsight --dependency $dep"
              ./gradlew :app:dependencyInsight --dependency "$dep" \
                --configuration "$cfg" --console=plain 2>&1 | sed -n '1,60p' || true
            done
          done

      - name: The camera/guava/concurrent slice of each graph
        run: |
          cd android
          for cfg in debugCompileClasspath debugRuntimeClasspath; do
            echo "############ $cfg ############"
            ./gradlew :app:dependencies --configuration "$cfg" --console=plain 2>&1 \
              | grep -iE 'guava|listenablefuture|concurrent|camera' | sed -n '1,80p' || true
          done

      - name: Engine graph, for contrast
        run: |
          cd android
          echo "############ :engine debugCompileClasspath ############"
          ./gradlew :engine:dependencies --configuration debugCompileClasspath --console=plain 2>&1 \
            | grep -iE 'guava|listenablefuture|media3|androidx.core|geckoview' | sed -n '1,80p' || true
